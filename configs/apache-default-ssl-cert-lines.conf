# /etc/apache2/sites-available/default-ssl.conf (excerpt)
# Changed from Debian's self-signed "snakeoil" placeholder to the
# Let's Encrypt certificate issued by FreePBX Certificate Management.
# The fullchain file = server certificate + Let's Encrypt intermediate.
# FreePBX renews these files in place (~every 60 days); Apache must be
# reloaded afterwards to pick up the new certificate.

SSLCertificateFile    /etc/asterisk/keys/pbx.touchdomain.co.za-fullchain.crt
SSLCertificateKeyFile /etc/asterisk/keys/pbx.touchdomain.co.za.key

# Applied with:
#   sudo cp default-ssl.conf default-ssl.conf.bak
#   sudo sed -i '...' default-ssl.conf
#   sudo apachectl configtest   -> Syntax OK
#   sudo systemctl reload apache2
